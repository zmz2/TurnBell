name: Publish TurnBell 1.5.0 once

on:
  push:
    branches: [publish-run-1.5.0]
    paths: [.turnbell-release-v5/READY]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: turnbell-1.5.0-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publish-run-1.5.0
          fetch-depth: 0

      - name: Authenticate, extract, and restore the staged source
        shell: bash
        run: |
          set -euo pipefail
          command -v flac >/dev/null || { sudo apt-get update && sudo apt-get install -y flac; }
          command -v ffmpeg >/dev/null || { sudo apt-get update && sudo apt-get install -y ffmpeg; }

          cat .turnbell-release-v5/chunk-* | tr -d '\r\n\t ' > /tmp/turnbell-source.tar.xz.b64
          test "$(wc -c < /tmp/turnbell-source.tar.xz.b64)" -eq 605296
          base64 --decode /tmp/turnbell-source.tar.xz.b64 > /tmp/turnbell-source.tar.xz
          test "$(wc -c < /tmp/turnbell-source.tar.xz)" -eq 453972
          echo "a93d87c44e7e55e1dcd46022ceff3dec06640e610bdb7d3f83cfe5e57992ceb3  /tmp/turnbell-source.tar.xz" | sha256sum -c --strict
          xz --test /tmp/turnbell-source.tar.xz
          rm -rf /tmp/turnbell-source
          mkdir -p /tmp/turnbell-source

          python3 - <<'PY'
          from pathlib import PurePosixPath
          import tarfile
          archive = "/tmp/turnbell-source.tar.xz"
          with tarfile.open(archive, "r:xz") as tf:
              for member in tf.getmembers():
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"unsafe archive member: {member.name!r}")
                  if not (member.isfile() or member.isdir()):
                      raise SystemExit(f"unsupported archive member: {member.name!r}")
              tf.extractall("/tmp/turnbell-source", filter="data")
          PY

          cd /tmp/turnbell-source
          mkdir -p extension/assets/sounds
          for encoded in .turnbell-transport/audio/*.flac; do
            name="$(basename "$encoded" .flac)"
            flac --decode --force --silent --force-raw-format --endian=little --sign=signed \
              "$encoded" --output-name="/tmp/${name}.raw"
            cat ".turnbell-transport/audio/${name}.header" "/tmp/${name}.raw" \
              > "extension/assets/sounds/${name}.wav"
          done

          ffmpeg -loglevel error -y -i docs/images/chrome-install.webp \
            -compression_level 9 docs/images/chrome-install.png
          ffmpeg -loglevel error -y -i docs/images/chrome-notification-demo.webp \
            -compression_level 9 docs/images/chrome-notification-demo.png
          rm -rf .turnbell-transport

          cat > /tmp/turnbell-audio.sha256 <<'EOF'
          7953dcf80c5492ae10afbd491d905bcd41194961cb91af765396a8c947853e74  extension/assets/sounds/digital.wav
          2110c0ba4168d35d1e56ae7a3914c49321448ecfb31c71ae94c931c82b4ecdeb  extension/assets/sounds/gentle-pop.wav
          d8b36d56bf9e045b8487b35e839f2a8f43fd757577da2f0425cfb70a99292761  extension/assets/sounds/glass.wav
          734522ee8fa43458c6456f66891f26ccf5bdbd496a260bfb17da2f9cc2ff6fc6  extension/assets/sounds/soft-chime.wav
          138b1dbac65e1c9c39ccb5c9a7e27437d6a41abad2663e636b6342bb7db581e6  extension/assets/sounds/warm-bell.wav
          EOF
          sha256sum -c /tmp/turnbell-audio.sha256

          python3 - <<'PY'
          import json, struct
          from pathlib import Path
          manifest = json.loads(Path("extension/manifest.json").read_text(encoding="utf-8"))
          assert manifest["manifest_version"] == 3
          assert manifest["version"] == "1.5.0"
          assert set(manifest.get("host_permissions", [])) == {
              "https://chatgpt.com/*",
              "https://chat.openai.com/*",
          }
          for path, expected in {
              "docs/images/chrome-install.png": (1884, 1538),
              "docs/images/chrome-notification-demo.png": (567, 288),
          }.items():
              data = Path(path).read_bytes()
              assert data[:8] == b"\x89PNG\r\n\x1a\n"
              assert struct.unpack(">II", data[16:24]) == expected
          PY

          for path in README.md LICENSE PRIVACY.md SECURITY.md CONTRIBUTING.md \
            THIRD_PARTY_NOTICES.md CHANGELOG.md INSTALL-WINDOWS.md \
            extension/manifest.json docs/images/notification-demo.webp \
            docs/images/chrome-notification-demo.png docs/images/edge-install.webp \
            docs/images/chrome-install.png docs/images/settings-overview.webp \
            docs/images/settings-advanced.webp; do
            test -s "$path"
          done
          test ! -e .git
          test ! -e .github
          test ! -e dist
          test ! -e .turnbell-transport
          test -z "$(find . -type d -name __pycache__ -print -quit)"
          test -z "$(find . -type f \( -name '*.pyc' -o -iname '*.exe' -o -iname '*.msi' \) -print -quit)"

      - name: Run tests and build verified release assets
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/turnbell-source
          node --test extension/tests/*.test.js
          find extension -name '*.js' -print0 | xargs -0 -n1 node --check
          python3 -m unittest discover -s scripts/tests -v
          python3 -m py_compile scripts/*.py scripts/tests/*.py
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          chmod +x scripts/build-all.sh
          ./scripts/build-all.sh
          python3 scripts/verify-artifacts.py
          test -f dist/TurnBell-1.5.0-extension.zip
          test -f dist/TurnBell-1.5.0-Edge-Only.zip
          test -f dist/TurnBell-1.5.0-project.zip
          test -f dist/SHA256SUMS.txt
          test -z "$(find . -type d -name __pycache__ -print -quit)"
          test -z "$(find . -type f \( -name '*.pyc' -o -iname '*.exe' -o -iname '*.msi' \) -print -quit)"

      - name: Publish the verified tree directly to main
        id: main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B turnbell-publish-main origin/main
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/turnbell-source/. .
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          test ! -e .github
          test ! -e .turnbell-transport
          test -z "$(find . -maxdepth 1 -type d -name '.turnbell-release*' -print -quit)"
          test -z "$(find . -type f \( -iname '*.exe' -o -iname '*.msi' \) -print -quit)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Publish TurnBell 1.5.0"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create the v1.5.0 release
        shell: bash
        run: |
          set -euo pipefail
          published_sha="${{ steps.main.outputs.sha }}"
          if gh release view v1.5.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete v1.5.0 --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          elif git ls-remote --tags origin refs/tags/v1.5.0 | grep -q .; then
            git push origin :refs/tags/v1.5.0
          fi

          cat > /tmp/release-notes.md <<'EOF'
          ## 主要功能
          - ChatGPT 回复真正完成后发送 Windows 系统通知
          - 已在 Microsoft Edge 与 Google Chrome 上完成实机测试
          - 支持 Instant / 极速回复、后台标签页与应用切换提醒
          - 刷新历史对话保持静默，每轮至多提醒一次
          - 支持 Windows 默认通知声和可选本地音效
          - 无需 EXE、本地端口或后台服务

          ## 隐私
          - 仅在浏览器本地观察页面 DOM 状态
          - 不读取 Cookie、密码、Token 或账户凭据
          - 不上传对话或助手回答正文
          - 不拦截 fetch、XMLHttpRequest 或网络响应流
          - 不使用 webRequest，无遥测和远程 JavaScript

          ## 已完成实机测试
          - Windows + Microsoft Edge
          - Windows + Google Chrome

          ## 尚未实机验证
          - macOS、Linux
          - Brave、Vivaldi 等其他 Chromium 浏览器
          - Edge InPrivate、Chrome 无痕模式
          - 受学校、公司或组织策略管理的浏览器环境

          TurnBell 是非官方、独立的开源项目，与 OpenAI、Microsoft 或 Google 不存在隶属、赞助、认证、合作或背书关系。
          EOF

          gh release create v1.5.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$published_sha" \
            --title "TurnBell 1.5.0" \
            --notes-file /tmp/release-notes.md \
            /tmp/turnbell-source/dist/TurnBell-1.5.0-extension.zip \
            /tmp/turnbell-source/dist/TurnBell-1.5.0-Edge-Only.zip \
            /tmp/turnbell-source/dist/TurnBell-1.5.0-project.zip \
            /tmp/turnbell-source/dist/SHA256SUMS.txt

          gh repo edit "$GITHUB_REPOSITORY" \
            --description "Privacy-first completion notifications for ChatGPT on Microsoft Edge and Google Chrome." \
            --add-topic browser-extension --add-topic chrome-extension \
            --add-topic edge-extension --add-topic chromium-extension \
            --add-topic manifest-v3 --add-topic chatgpt --add-topic notifications \
            --add-topic windows --add-topic privacy --add-topic productivity || true

      - name: Verify the public result and remove every non-main branch
        shell: bash
        run: |
          set -euo pipefail
          published_sha="${{ steps.main.outputs.sha }}"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$published_sha"
          rm -rf /tmp/turnbell-main
          git worktree add --detach /tmp/turnbell-main origin/main
          cd /tmp/turnbell-main

          test -f README.md
          test -f extension/manifest.json
          test ! -e .github
          test ! -e .turnbell-transport
          test -z "$(find . -maxdepth 1 -type d -name '.turnbell-release*' -print -quit)"
          test -z "$(find . -type d -name __pycache__ -print -quit)"
          test -z "$(find . -type f \( -name '*.pyc' -o -iname '*.exe' -o -iname '*.msi' \) -print -quit)"
          node --test extension/tests/*.test.js
          find extension -name '*.js' -print0 | xargs -0 -n1 node --check
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/verify-artifacts.py
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete

          images=(notification-demo.webp chrome-notification-demo.png edge-install.webp chrome-install.png settings-overview.webp settings-advanced.webp)
          for name in "${images[@]}"; do
            path="docs/images/$name"
            test -s "$path"
            gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=main" >/dev/null
          done
          gh api -H "Accept: application/vnd.github.html+json" \
            "repos/${GITHUB_REPOSITORY}/readme?ref=main" > /tmp/turnbell-readme.html
          for name in "${images[@]}"; do grep -Fq "$name" /tmp/turnbell-readme.html; done

          curl --fail --location --retry 5 --retry-all-errors \
            "https://github.com/${GITHUB_REPOSITORY}/archive/refs/heads/main.zip" \
            --output /tmp/TurnBell-main.zip
          unzip -t /tmp/TurnBell-main.zip >/dev/null
          unzip -Z1 /tmp/TurnBell-main.zip | grep -Fx 'TurnBell-main/extension/manifest.json'

          assets="$(gh release view v1.5.0 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          for asset in TurnBell-1.5.0-extension.zip TurnBell-1.5.0-Edge-Only.zip TurnBell-1.5.0-project.zip SHA256SUMS.txt; do
            grep -Fxq "$asset" <<< "$assets"
          done
          test "$(gh release view v1.5.0 --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)" = "$published_sha"
          cd "$GITHUB_WORKSPACE"
          git worktree remove /tmp/turnbell-main

          while IFS= read -r number; do
            test -n "$number" || continue
            gh pr close "$number" --repo "$GITHUB_REPOSITORY" \
              --comment "TurnBell 1.5.0 has been published and verified directly on main; temporary publication branches are being removed." || true
          done < <(gh pr list --repo "$GITHUB_REPOSITORY" --state open --json number --jq '.[].number')

          while read -r _ ref; do
            branch="${ref#refs/heads/}"
            if [[ "$branch" != "main" ]]; then git push origin --delete "$branch"; fi
          done < <(git ls-remote --heads origin)

          mapfile -t branches < <(git ls-remote --heads origin | awk '{sub("refs/heads/", "", $2); print $2}')
          test "${#branches[@]}" -eq 1
          test "${branches[0]}" = main
          git ls-remote --exit-code --tags origin refs/tags/v1.5.0 >/dev/null
          gh release view v1.5.0 --repo "$GITHUB_REPOSITORY" >/dev/null
