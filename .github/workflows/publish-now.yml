name: Directly publish TurnBell 1.5.0

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: turnbell-direct-publish-1.5.0
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.issue.title == 'TurnBell direct publish 1.5.0'
    runs-on: ubuntu-latest
    steps:
      - name: Check out staged project
        uses: actions/checkout@v4
        with:
          ref: publish-final
          fetch-depth: 0

      - name: Reconstruct uploaded project
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import lzma
          from pathlib import Path

          root = Path('.turnbell-release')
          chunks = [root / f'chunk-{i:03d}' for i in range(13)]
          for last in (11, 12):
              encoded = ''.join(
                  ''.join(path.read_text(encoding='utf-8').split())
                  for path in chunks[:last + 1]
              )
              try:
                  archive = base64.b64decode(encoded, validate=True)
                  lzma.decompress(archive)
              except Exception:
                  continue
              Path('/tmp/turnbell-source.tar.xz').write_bytes(archive)
              break
          else:
              raise SystemExit('Unable to reconstruct the uploaded project archive')
          PY

          base64 --decode .turnbell-release/final-overlay.tar.gz.b64 > /tmp/turnbell-overlay.tar.gz
          rm -rf /tmp/turnbell-source /tmp/turnbell-overlay
          mkdir -p /tmp/turnbell-source /tmp/turnbell-overlay
          tar -xJf /tmp/turnbell-source.tar.xz -C /tmp/turnbell-source
          tar -xzf /tmp/turnbell-overlay.tar.gz -C /tmp/turnbell-overlay
          cp -a /tmp/turnbell-overlay/files/. /tmp/turnbell-source/

          rm -rf /tmp/turnbell-source/.git \
                 /tmp/turnbell-source/.github \
                 /tmp/turnbell-source/.turnbell-release \
                 /tmp/turnbell-source/.turnbell-transport \
                 /tmp/turnbell-source/dist
          find /tmp/turnbell-source -type d -name __pycache__ -prune -exec rm -rf {} +
          find /tmp/turnbell-source -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete

      - name: Push directly to main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B turnbell-direct-main origin/main
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/turnbell-source/. .

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Publish TurnBell 1.5.0'
            git push origin HEAD:main
          fi

          for branch in \
            agent/publish-turnbell-1.5.0 \
            bootstrap-publish \
            publish-final \
            publish-run-1.5.0 \
            publish-turnbell-1.5.0-final; do
            git push origin --delete "$branch" || true
          done

      - name: Close publication trigger
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --comment 'TurnBell 1.5.0 was published directly to main.'
