name: Bootstrap TurnBell source

on:
  push:
    branches:
      - bootstrap-publish
    paths:
      - .turnbell-upload/READY

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out bootstrap branch
        uses: actions/checkout@v4
        with:
          ref: bootstrap-publish
          fetch-depth: 0

      - name: Reconstruct and inspect source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .turnbell-upload/chunk-* | tr -d '\r\n\t ' > /tmp/turnbell.tar.xz.b64
          base64 --decode /tmp/turnbell.tar.xz.b64 > /tmp/turnbell.tar.xz
          sha256sum /tmp/turnbell.tar.xz
          xz --test /tmp/turnbell.tar.xz
          tar -tJf /tmp/turnbell.tar.xz | tee /tmp/archive-list.txt
          test -f /tmp/archive-list.txt
          grep -Fx 'extension/manifest.json' /tmp/archive-list.txt
          grep -Fx 'README.md' /tmp/archive-list.txt

      - name: Publish exact source tree to main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B publish-main origin/main
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xJf /tmp/turnbell.tar.xz -C .
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish TurnBell 1.5.0"
          git push origin HEAD:main
