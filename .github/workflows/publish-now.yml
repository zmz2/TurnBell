name: Publish TurnBell 1.5.0 directly

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: turnbell-publish-main-final
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.issue.title == 'Publish TurnBell 1.5.0 now'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      TRIGGER_ISSUE: ${{ github.event.issue.number }}
    steps:
      - name: Check out staged source
        uses: actions/checkout@v4
        with:
          ref: publish-final
          fetch-depth: 0

      - name: Reconstruct and push main
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee /tmp/turnbell-publish.log) 2>&1

          report_failure() {
            status=$?
            {
              echo 'Direct publication failed. Last log lines:'
              echo '```text'
              tail -n 80 /tmp/turnbell-publish.log || true
              echo '```'
            } > /tmp/turnbell-failure.md
            gh issue comment "$TRIGGER_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/turnbell-failure.md || true
            exit "$status"
          }
          trap report_failure ERR

          gh issue comment "$TRIGGER_ISSUE" --repo "$GITHUB_REPOSITORY" --body 'Direct publication started.'

          rm -rf /tmp/turnbell-source /tmp/turnbell-overlay
          mkdir -p /tmp/turnbell-source /tmp/turnbell-overlay

          python3 - <<'PY'
          import base64
          import lzma
          from pathlib import Path

          root = Path('.turnbell-release')
          encoded = ''.join(
              ''.join((root / f'chunk-{index:03d}').read_text(encoding='utf-8').split())
              for index in range(12)
          )
          encoded += '=' * (-len(encoded) % 4)
          archive = base64.b64decode(encoded, validate=True)
          lzma.decompress(archive)
          Path('/tmp/turnbell-source.tar.xz').write_bytes(archive)

          overlay_encoded = ''.join(
              (root / 'final-overlay.tar.gz.b64').read_text(encoding='utf-8').split()
          )
          overlay_encoded += '=' * (-len(overlay_encoded) % 4)
          Path('/tmp/turnbell-overlay.tar.gz').write_bytes(
              base64.b64decode(overlay_encoded, validate=True)
          )
          PY

          xz --test /tmp/turnbell-source.tar.xz
          gzip --test /tmp/turnbell-overlay.tar.gz
          tar -xJf /tmp/turnbell-source.tar.xz -C /tmp/turnbell-source
          tar -xzf /tmp/turnbell-overlay.tar.gz -C /tmp/turnbell-overlay

          if [[ -d /tmp/turnbell-overlay/files ]]; then
            cp -a /tmp/turnbell-overlay/files/. /tmp/turnbell-source/
          else
            cp -a /tmp/turnbell-overlay/. /tmp/turnbell-source/
          fi

          if [[ ! -f /tmp/turnbell-source/README.md ]]; then
            project_root="$(dirname "$(find /tmp/turnbell-source -type f -path '*/extension/manifest.json' -print -quit)")"
            project_root="$(dirname "$project_root")"
            test -f "$project_root/README.md"
            rm -rf /tmp/turnbell-project
            mv "$project_root" /tmp/turnbell-project
            rm -rf /tmp/turnbell-source
            mv /tmp/turnbell-project /tmp/turnbell-source
          fi

          test -s /tmp/turnbell-source/README.md
          test -s /tmp/turnbell-source/extension/manifest.json
          test "$(node -p "require('/tmp/turnbell-source/extension/manifest.json').version")" = '1.5.0'

          rm -rf /tmp/turnbell-source/.git \
                 /tmp/turnbell-source/.github \
                 /tmp/turnbell-source/dist
          rm -f /tmp/turnbell-source/.turnbell-source-manifest.sha256
          find /tmp/turnbell-source -maxdepth 1 -type d -name '.turnbell-*' -prune -exec rm -rf {} +
          find /tmp/turnbell-source -type d -name __pycache__ -prune -exec rm -rf {} +
          find /tmp/turnbell-source -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete

          git fetch origin main
          git checkout -B turnbell-direct-main origin/main
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/turnbell-source/. .

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish TurnBell 1.5.0'
          git push --force origin HEAD:main

          for branch in \
            agent/publish-turnbell-1.5.0 \
            bootstrap-publish \
            publish-final \
            publish-run-1.5.0 \
            publish-turnbell-1.5.0-final; do
            git push origin --delete "$branch" || true
          done

          trap - ERR
          gh issue close "$TRIGGER_ISSUE" --repo "$GITHUB_REPOSITORY" --comment 'TurnBell 1.5.0 was published directly to main.'
