name: Push TurnBell directly to main

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: turnbell-direct-main-filebin
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.issue.title == 'TurnBell push directly to main'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      TRIGGER_ISSUE: ${{ github.event.issue.number }}
      SOURCE_URL: https://filebin.net/turnbell-4e26b2db2d82515d/TurnBell-full-source-1.5.0.tar.xz
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Push project directly
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee /tmp/turnbell-push.log) 2>&1

          report_failure() {
            status=$?
            {
              echo 'Direct push failed. Last log lines:'
              echo '```text'
              tail -n 60 /tmp/turnbell-push.log || true
              echo '```'
            } > /tmp/turnbell-failure.md
            gh issue comment "$TRIGGER_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/turnbell-failure.md || true
            exit "$status"
          }
          trap report_failure ERR

          gh issue comment "$TRIGGER_ISSUE" --repo "$GITHUB_REPOSITORY" --body 'Direct push started.'

          rm -rf /tmp/turnbell-source /tmp/turnbell-source.tar.xz
          curl --fail --location --retry 8 --retry-all-errors \
            --connect-timeout 30 --max-time 900 \
            "$SOURCE_URL" --output /tmp/turnbell-source.tar.xz
          test -s /tmp/turnbell-source.tar.xz
          xz --test /tmp/turnbell-source.tar.xz
          mkdir -p /tmp/turnbell-source

          python3 - <<'PY'
          from pathlib import PurePosixPath
          import tarfile

          with tarfile.open('/tmp/turnbell-source.tar.xz', 'r:xz') as archive:
              members = archive.getmembers()
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'unsafe archive path: {member.name!r}')
                  if not (member.isfile() or member.isdir()):
                      raise SystemExit(f'unsupported archive member: {member.name!r}')
              archive.extractall('/tmp/turnbell-source', members=members, filter='data')
          PY

          test -s /tmp/turnbell-source/README.md
          test -s /tmp/turnbell-source/extension/manifest.json
          test "$(node -p "require('/tmp/turnbell-source/extension/manifest.json').version")" = '1.5.0'

          rm -rf /tmp/turnbell-source/.git \
                 /tmp/turnbell-source/.github \
                 /tmp/turnbell-source/dist
          rm -f /tmp/turnbell-source/.turnbell-source-manifest.sha256
          find /tmp/turnbell-source -maxdepth 1 -type d -name '.turnbell-*' -prune -exec rm -rf {} +
          find /tmp/turnbell-source -type d -name __pycache__ -prune -exec rm -rf {} +
          find /tmp/turnbell-source -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete

          git fetch origin main
          git checkout -B turnbell-direct-main origin/main
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/turnbell-source/. .

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Publish TurnBell 1.5.0'
            git push origin HEAD:main
          fi

          while read -r _ ref; do
            branch="${ref#refs/heads/}"
            if [[ "$branch" != main ]]; then
              git push origin --delete "$branch" || true
            fi
          done < <(git ls-remote --heads origin)

          trap - ERR
          gh issue close "$TRIGGER_ISSUE" --repo "$GITHUB_REPOSITORY" --comment 'TurnBell 1.5.0 was pushed directly to main.'
